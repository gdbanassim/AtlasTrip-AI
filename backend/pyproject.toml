[project]
name = "atlastrip-backend"
version = "0.1.0"
description = "FastAPI backend for the AtlasTrip autonomous travel planner."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.0",
  "uvicorn[standard]>=0.38.0",
  "pydantic>=2.13.0",
  "pydantic-settings>=2.13.1",
  "httpx>=0.28.0",
  "langgraph>=1.1.6",
  "langchain>=1.2.0",
  "langchain-groq>=1.1.2",
  "mcp[cli]>=1.27.0",
  "python-dotenv>=1.2.0"
]

[tool.uv]
package = false
